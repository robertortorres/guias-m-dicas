services:
  guias:
    build: .
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-8080}:8000"
    environment:
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Configure APP_PASSWORD no arquivo .env}
      OCR_LANG: por+eng
      RETENTION_HOURS: 24
      MAX_UPLOAD_MB: 100
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - guias_data:/data
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  guias_data:
